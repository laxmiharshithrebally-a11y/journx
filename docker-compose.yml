version: '3.8'

services:
  journx:
    build:
      context: .
      dockerfile: Dockerfile
    image: journx-platform:latest
    container_name: journx-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    volumes:
      - journx-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  journx-data:
    driver: local
